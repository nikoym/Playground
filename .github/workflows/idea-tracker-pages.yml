name: Idea Tracker — test & deploy

on:
  push:
    branches: [main]
    paths: ["idea-tracker/**", ".github/workflows/idea-tracker-pages.yml"]
  pull_request:
    paths: ["idea-tracker/**", ".github/workflows/idea-tracker-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idea-tracker-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idea-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: idea-tracker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: idea-tracker/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
